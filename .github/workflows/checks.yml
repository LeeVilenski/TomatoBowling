name: Checks

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older run
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Type-check, tests and simulations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Physics simulation
        run: npm run check:physics
      - name: Leaderboard API
        run: npm run check:api

  rivals:
    name: Computer rivals play to their level
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every rival through seeded, simulated games at their own venue (a short run; use
      # `npm run check:rivals -- --games 16` locally when tuning)
      - name: Simulated games for each rival
        run: npm run check:rivals -- --games 6

  browser:
    name: Build and play in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Play a few throws (pause, replay, scoring)
        run: npm run check:browser
