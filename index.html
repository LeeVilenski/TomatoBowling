<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1026" />
    <title>Tomato Dave's Ten-pin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <header>
        <h1>Tomato Dave's Ten-pin</h1>
        <span class="tag">Stage 1 prototype</span>
      </header>
      <p id="status" aria-live="polite"></p>
      <p id="readout"></p>
    </div>

    <div id="controls">
      <div class="group">
        <span class="label">Move</span>
        <button data-action="left" data-repeat aria-label="Move left">◀</button>
        <button data-action="right" data-repeat aria-label="Move right">▶</button>
      </div>
      <div class="group">
        <span class="label">Aim</span>
        <button data-action="aimL" data-repeat aria-label="Aim left">↖</button>
        <button data-action="aimR" data-repeat aria-label="Aim right">↗</button>
      </div>
      <div class="group">
        <span class="label">Speed</span>
        <button data-action="slower" data-repeat aria-label="Slower">−</button>
        <button data-action="faster" data-repeat aria-label="Faster">+</button>
      </div>
      <div class="group main">
        <button data-action="throw" class="throw">Throw</button>
        <button data-action="reset">Reset</button>
      </div>
    </div>

    <p id="keys">Keys: ←/→ move · A/D aim · ↑/↓ speed · Space throw · R reset</p>
    <div id="loading">Loading the alley…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
