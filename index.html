<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1026" />
    <title>Tomato Dave's Ten-pin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <canvas id="trail"></canvas>

    <div id="hud">
      <header>
        <h1>Tomato Dave's Ten-pin</h1>
        <span class="tag">Stage 2 prototype</span>
      </header>
      <p id="status" aria-live="polite"></p>
      <p id="readout"></p>
    </div>

    <div id="power" aria-hidden="true"><div id="power-fill"></div><span>Power</span></div>

    <div id="spin" class="mouse-only">
      <button id="spin-left" aria-label="Spin left">◀</button>
      <span>Spin <b id="spin-value">none</b></span>
      <button id="spin-right" aria-label="Spin right">▶</button>
    </div>

    <p id="hint">
      <span class="touch-only">Drag sideways to move · <b>Swipe up to throw</b> · Curve your swipe to spin</span>
      <span class="mouse-only">Mouse: move · Wheel or A/D: aim · Q/E: spin · <b>Hold click or Space, release to throw</b> · R: new rack</span>
    </p>

    <div id="loading">Loading the alley…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
